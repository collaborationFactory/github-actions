name: 'Backend E2E: check out a commit'
description: 'Moves an existing clone to one commit, and fails unless it ends up there'
inputs:
  dir:
    description: 'The clone, relative to the workspace'
    required: true
  sha:
    description: 'The full commit SHA to check out'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Check out the commit
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        SHA: ${{ inputs.sha }}
      run: '"$GITHUB_ACTION_PATH/../../../tools/scripts/backend-e2e/checkout-commit.sh" "${DIR}" "${SHA}"'
