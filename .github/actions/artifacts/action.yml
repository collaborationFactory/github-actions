name: 'Frontend Artifacts Handler Action'
description: 'Github Action to handle frontend artifacts'
outputs:
  tag:
    description: 'The pushed version tag, set only once the version is published and tagged (release flow only)'
    value: ${{ steps.handler.outputs.tag }}
  previous_tag:
    description: 'The previous tag of the same release line, empty for X.Y.1 (release flow only)'
    value: ${{ steps.handler.outputs.previous_tag }}
  is_latest:
    description: 'true if the pushed tag is the highest version/* tag (release flow only)'
    value: ${{ steps.handler.outputs.is_latest }}
  version:
    description: 'The published snapshot version, e.g. 0.0.0-<branch>-<pr> (PR snapshot only)'
    value: ${{ steps.handler.outputs.version }}
  packages:
    description: 'JSON array of the published package names, [] when nothing was published (PR snapshot only)'
    value: ${{ steps.handler.outputs.packages }}
  integrities:
    description: 'JSON object mapping each published package name to its npm integrity, {} when nothing was published (PR snapshot only)'
    value: ${{ steps.handler.outputs.integrities }}
runs:
  using: 'composite'
  steps:
    - run: printenv
      shell: bash
    - run: cd "$GITHUB_ACTION_PATH/../../.." && pwd && npm ci
      shell: bash
    - id: handler
      run: npx ts-node "$GITHUB_ACTION_PATH/../../../tools/scripts/artifacts/main.ts"
      shell: bash
