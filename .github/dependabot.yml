version: 2
updates:
  # Default branch (master)
  - package-ecosystem: "github-actions"
    directory: "/"
    ignore:
      - dependency-name: 'collaborationFactory/*'
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Active release branches (release/25.2 → release/26.2)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release/25.2"
    ignore:
      - dependency-name: 'collaborationFactory/*'
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

