name: Check wether upmerge is necessary on a CRON Schedule

on:
  workflow_call:
    secrets:
      SLACK_TOKEN_UPMERGE:
        required: true
      GIT_USER_EMAIL:
        required: true
      GIT_USER:
        required: true

jobs:
  check-upmerge:
    name: Run Upmerge Flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.GHA_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 18.19.1

      - name: Cache Node Modules
        id: npm-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

      - name: check if upmerge is necessary and post to slack
        uses: collaborationFactory/github-actions/.github/actions/upmerge@release/25.2
        env:
          SLACK_TOKEN_UPMERGE: ${{ secrets.SLACK_TOKEN_UPMERGE }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GIT_USER: ${{ secrets.GIT_USER }}

