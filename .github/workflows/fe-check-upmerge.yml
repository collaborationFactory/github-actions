name: Check wether upmerge is necessary on a CRON Schedule

on:
  workflow_call:
    secrets:
      SLACK_TOKEN_UPMERGE:
        required: true
      GIT_USER_EMAIL:
        required: true
      GIT_USER:
        required: true

jobs:
  check-upmerge:
    name: Run Upmerge Flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.GHA_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0

      - name: Cache Node Modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

      - name: check if upmerge is necessary and post to slack
        uses: collaborationFactory/github-actions/.github/actions/upmerge@release/25.4
        env:
          SLACK_TOKEN_UPMERGE: ${{ secrets.SLACK_TOKEN_UPMERGE }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GIT_USER: ${{ secrets.GIT_USER }}

