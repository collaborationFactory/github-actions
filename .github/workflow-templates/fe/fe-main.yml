name: 'Frontend Main CI'
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: write

# no concurrency group on purpose: every push must publish its snapshot. A cancelled run, or a
# pending run dropped by a group, would lose the snapshot of the projects affected only by its
# push, because the next run checks affected projects since its own github.event.before.

env:
  NX_BRANCH: ${{ github.event.number }}
  NX_RUN_GROUP: ${{ github.run_id }}

jobs:
  install-deps:
    uses: collaborationFactory/github-actions/.github/workflows/fe-install-deps.yml@master
    with:
      GHA_REF: ''
    secrets:
      DOT_NPMRC: ${{ secrets.DOT_NPMRC }}

  # This job is only needed in case you are using Percy
  e2e-tests:
    needs: install-deps
    uses: collaborationFactory/github-actions/.github/workflows/fe-e2e.yml@master
    with:
      GHA_REF: ''
      GHA_BASE: ${{ github.event.before }}
    secrets:
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

  build:
    needs: install-deps
    uses: collaborationFactory/github-actions/.github/workflows/fe-build.yml@master
    with:
      GHA_REF: ''
      GHA_BASE: ${{ github.event.before }}

  snapshot:
    needs: build
    uses: collaborationFactory/github-actions/.github/workflows/fe-snapshot.yml@master
    with:
      GHA_REF: ''
      GHA_BASE: ${{ github.event.before }}
    secrets:
      JFROG_BASE64_TOKEN: ${{ secrets.JFROG_BASE64_TOKEN }}
      JFROG_URL: ${{ secrets.JFROG_URL }}
      JFROG_USER: ${{ secrets.JFROG_USER }}
